name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU dependencies and checkout
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-cpu.txt torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c constraints-cpu.txt -e .
      - name: Validate source, public evidence, and CPU inference
        run: python -B tools/validate_release.py
