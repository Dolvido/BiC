[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-in-computer"
version = "0.7.0"
description = "A small, trainable cluster of brain-inspired neural networks"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Luke Payne"}]
requires-python = ">=3.10"
dependencies = ["torch>=2.6,<3", "numpy>=1.24,<3", "Pillow>=10,<13"]

[project.scripts]
brain-in-computer = "brain_in_computer.__main__:main"

[project.urls]
Repository = "https://github.com/Dolvido/BiC"
Issues = "https://github.com/Dolvido/BiC/issues"

[tool.setuptools.packages.find]
include = ["brain_in_computer*"]

[tool.setuptools.package-data]
"brain_in_computer" = ["teaching_viewer.html", "adaptation_viewer.html"]
"brain_in_computer.computer_use" = ["viewer.html"]
